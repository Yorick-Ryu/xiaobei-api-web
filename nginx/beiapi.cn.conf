server {
    server_name beiapi.cn www.beiapi.cn;

    include /etc/nginx/snippets/openai-payload-too-large.conf;

    underscores_in_headers on;
    client_max_body_size 16m;

    location = /v1 {
        client_max_body_size 16m;
        return 404;
    }

    location ^~ /v1/ {
        client_max_body_size 16m;
        return 404;
    }

    location = /console/log {
        return 302 /wallet?show_history=true;
    }

    location = /logo.png {
        alias /usr/share/nginx/html/beiapi-assets/logo-north.png;
        add_header Cache-Control "public, max-age=300";
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/beiapi-assets/favicon-north.ico;
        add_header Cache-Control "public, max-age=300";
    }

    location = /plans {
        root /usr/share/nginx/html/beiapi-plans;
        try_files /plans.html =404;
    }

    location = /plans/ {
        return 301 /plans;
    }

    location ^~ /beiapi-assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60";
    }

    # Public display content is hosted on this origin; the database option is unchanged.
    location = /api/home_page_content {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"success":true,"message":"","data":"https://$host/beiapi-home/"}';
    }

    location = /beiapi-home {
        return 301 /beiapi-home/;
    }

    location = /beiapi-home/ {
        root /usr/share/nginx/html;
        try_files /beiapi-home/index.html =404;
        default_type text/html;
        gzip on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400, stale-if-error=86400";
    }

    location ^~ /beiapi-home/assets/ {
        alias /usr/share/nginx/html/beiapi-home/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400, stale-if-error=86400";

        proxy_pass http://capacity_backend_3000;
        proxy_redirect http://127.0.0.1:3000/ /;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_cookie_flags session samesite=lax;

        sub_filter_once on;
        sub_filter '</head>' '<script defer src="/beiapi-assets/nav-plans.js"></script></head>';
    }

    location / {
        proxy_pass http://capacity_backend_3000;
        proxy_redirect http://127.0.0.1:3000/ /;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_cookie_flags session samesite=lax;

        sub_filter_once on;
        sub_filter '</head>' '<script defer src="/beiapi-assets/nav-plans.js"></script></head>';
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/beiapi.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/beiapi.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Cloudflare Authenticated Origin Pulls (staged before enforcement).
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/aop-audit.log aop_audit if=$aop_audit_loggable;


}
server {
    if ($host = www.beiapi.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = beiapi.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name beiapi.cn www.beiapi.cn;
    return 404; # managed by Certbot




}
