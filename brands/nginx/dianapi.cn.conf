server {
    listen 80;
    server_name dianapi.cn www.dianapi.cn api.dianapi.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name dianapi.cn;
    ssl_certificate /etc/letsencrypt/live/dianapi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dianapi.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://www.dianapi.cn$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.dianapi.cn;

    include /etc/nginx/snippets/openai-payload-too-large.conf;
    client_max_body_size 16m;
    include /opt/stacks/bingdian-brand-proxy-live/cloudflare-realip.conf;
    ssl_certificate /etc/letsencrypt/live/dianapi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dianapi.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location = / {
        proxy_pass http://capacity_backend_3103;
        proxy_redirect http://127.0.0.1:3103/ /;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400, stale-if-error=86400";
    }

    include /opt/stacks/bingdian-brand-proxy-live/nginx-locations.conf;
}
server {
    listen 443 ssl http2;
    server_name api.dianapi.cn;

    include /etc/nginx/snippets/openai-payload-too-large.conf;
    client_max_body_size 64m;
    ssl_certificate /etc/letsencrypt/live/dianapi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dianapi.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location = / { return 302 https://www.dianapi.cn/; }
    location = /sign-in { return 302 https://www.dianapi.cn$request_uri; }
    location = /sign-up { return 302 https://www.dianapi.cn$request_uri; }
    include /opt/stacks/bingdian-brand-proxy-live/nginx-locations.conf;
}
