# Include inside the new domain's TLS server block after the domain is confirmed.
# Do not include in existing BeiAPI or Novapi virtual hosts.
underscores_in_headers on;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

location ~ ^/api/(user/(pay|((stripe|creem|waffo|waffo-pancake)/pay))|subscription/(balance|epay|stripe|creem|waffo-pancake)/pay)(/|$) {
    default_type application/json;
    return 403 '{"success":false,"message":"充值请联系客服获取兑换码"}';
}
location = /api/status {
    proxy_pass http://capacity_backend_3103;
        proxy_set_header Host 127.0.0.1:3103;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3103/ /;
        # Linux DO login is exclusive to the BeiAPI main website.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"linuxdo_oauth":true' '"linuxdo_oauth":false';
}
    # Block Linux DO callbacks on branch domains, including direct API use.
    location ~* ^/(api/)?oauth/linuxdo(/|$) {
        default_type application/json;
        return 403 '{"success":false,"message":"Linux DO login is available only on www.beiapi.cn"}';
    }


location = /api/user/topup/info { proxy_pass http://capacity_backend_3103;
        proxy_redirect http://127.0.0.1:3103/ /; }
location = /api/home_page_content {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"success":true,"message":"","data":"https://www.dianapi.cn/bingdian/home.html"}';
}
location = /bingdian/home.html {
    alias /opt/stacks/bingdian-brand-proxy-live/public/home.html;
    default_type text/html;
    gzip on;
    gzip_vary on;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400, stale-if-error=86400";
}
location = /api/subscription/plans { proxy_pass http://capacity_backend_3000;
        proxy_redirect http://127.0.0.1:3000/ /; }
location /api/ { proxy_pass http://capacity_backend_3000;
        proxy_redirect http://127.0.0.1:3000/ /; }
location ^~ /v1/ {
    client_max_body_size 64m;
    proxy_pass http://capacity_backend_3000;
        proxy_redirect http://127.0.0.1:3000/ /;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
location /static/ { proxy_pass http://capacity_backend_3000;
        proxy_redirect http://127.0.0.1:3000/ /; }
location /assets/ { proxy_pass http://capacity_backend_3000;
        proxy_redirect http://127.0.0.1:3000/ /; }
location / { proxy_pass http://capacity_backend_3103;
        proxy_redirect http://127.0.0.1:3103/ /; }
