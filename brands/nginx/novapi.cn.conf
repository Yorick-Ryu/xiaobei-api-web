server {
    listen 443 ssl http2;
    server_name novapi.cn www.novapi.cn;

    include /etc/nginx/snippets/openai-payload-too-large.conf;

    ssl_certificate /etc/letsencrypt/live/novapi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novapi.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare Authenticated Origin Pulls (staged before enforcement).
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/aop-audit.log aop_audit if=$aop_audit_loggable;

    underscores_in_headers on;
    client_max_body_size 16m;

    location = /v1 {
        client_max_body_size 16m;
        return 404;
    }

    location ^~ /v1/ {
        client_max_body_size 16m;
        return 404;
    }

    location = /api/user/pay {
        return 404;
    }

    location = /api/user/pay/ {
        return 404;
    }

    location = /api/user/stripe/pay {
        return 404;
    }

    location = /api/user/creem/pay {
        return 404;
    }

    location = /api/user/waffo/pay {
        return 404;
    }

    location = /api/user/waffo-pancake/pay {
        return 404;
    }

    location = /api/subscription {
        return 404;
    }

    location = /api/subscription/plans {
        proxy_pass http://capacity_backend_3100/api/subscription/plans;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3100/api/subscription/plans /api/subscription/plans;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/subscription/self {
        proxy_pass http://capacity_backend_3100/api/subscription/self;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3100/api/subscription/self /api/subscription/self;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/subscription/self/preference {
        proxy_pass http://capacity_backend_3100/api/subscription/self/preference;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3100/api/subscription/self/preference /api/subscription/self/preference;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location ^~ /api/subscription/ {
        return 404;
    }

    location = /api/status {
        # Linux DO login is exclusive to the BeiAPI main website.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"linuxdo_oauth":true' '"linuxdo_oauth":false';
        proxy_pass http://capacity_backend_3100/api/status;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3100/api/status /api/status;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/home_page_content {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"success":true,"message":"","data":"https://$host/novapi-home/"}';
    }

    location = /api/user/topup/info {
        proxy_pass http://capacity_backend_3100/api/user/topup/info;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3100/api/user/topup/info /api/user/topup/info;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/log {
        proxy_pass http://capacity_backend_3000/api/log/;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3000/api/log/ /api/log;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/data {
        proxy_pass http://capacity_backend_3000/api/data/;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3000/api/data/ /api/data;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/task {
        proxy_pass http://capacity_backend_3000/api/task/;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3000/api/task/ /api/task;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/mj {
        proxy_pass http://capacity_backend_3000/api/mj/;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3000/api/mj/ /api/mj;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logo.png {
        proxy_pass http://capacity_backend_3100/logo.png;
        proxy_set_header Connection "";
        proxy_redirect http://127.0.0.1:3100/logo.png /logo.png;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /novapi-wallet.js {
        alias /opt/stacks/novapi-brand-proxy/novapi-wallet.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # Block Linux DO callbacks on branch domains, including direct API use.
    location ~* ^/(api/)?oauth/linuxdo(/|$) {
        default_type application/json;
        return 403 '{"success":false,"message":"Linux DO login is available only on www.beiapi.cn"}';
    }

    location = /novapi-home {
        return 301 /novapi-home/;
    }

    location = /novapi-home/ {
        root /usr/share/nginx/html;
        try_files /novapi-home/index.html =404;
        default_type text/html;
        gzip on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400, stale-if-error=86400";
    }

    location ^~ /novapi-home/assets/ {
        alias /usr/share/nginx/html/novapi-home/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400, stale-if-error=86400";

        proxy_pass http://capacity_backend_3000;
        proxy_redirect http://127.0.0.1:3000/ /;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter_once off;
        sub_filter '</body>' '<script defer src="/novapi-wallet.js"></script></body>';

        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_cookie_flags session samesite=lax;
    }

    location / {
        proxy_pass http://capacity_backend_3000;
        proxy_redirect http://127.0.0.1:3000/ /;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $cloudflare_client_ip;
        proxy_set_header X-Forwarded-For $cloudflare_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter_once off;
        sub_filter '</body>' '<script defer src="/novapi-wallet.js"></script></body>';

        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_cookie_flags session samesite=lax;
    }
}

